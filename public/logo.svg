<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182b37"/>
      <stop offset="100%" stop-color="#0c161c"/>
    </linearGradient>
    <linearGradient id="hivisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFB800" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle border ring -->
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="url(#hivisGrad)" stroke-width="20" stroke-opacity="0.85"/>

  <!-- Automotive Symbol: Stylized Fastback Car Silhouette + Multi 'M' Wing -->
  <g filter="url(#glow)">
    <!-- Roof & Windshield -->
    <path d="M168 200 L212 118 C222 100 236 92 256 92 C276 92 290 100 300 118 L344 200 Z" 
          fill="url(#hivisGrad)" opacity="0.95"/>
    <!-- Windshield cutout / Glass reflection in dark ink -->
    <path d="M184 194 L222 126 C228 116 238 110 256 110 C274 110 284 116 290 126 L328 194 Z" 
          fill="#0c161c"/>

    <!-- Car Body & Hood -->
    <path d="M110 240 C100 244 88 256 88 274 L88 322 C88 340 102 354 120 354 L138 354 C150 354 162 344 166 332 L172 314 C176 304 186 296 198 296 L314 296 C326 296 336 304 340 314 L346 332 C350 344 362 354 374 354 L392 354 C410 354 424 340 424 322 L424 274 C424 256 412 244 402 240 L360 216 C348 208 334 204 320 204 L192 204 C178 204 164 208 152 216 Z" 
          fill="url(#hivisGrad)"/>

    <!-- Aerodynamic Center Speed Line / Hood Crease -->
    <path d="M256 204 L256 288" stroke="#0c161c" stroke-width="12" stroke-linecap="round"/>

    <!-- Left High-Intensity LED Headlamp -->
    <path d="M128 262 L180 262 C188 262 194 270 190 278 L178 296 C174 302 166 306 158 306 L124 306 C114 306 108 296 112 286 L120 268 C122 264 125 262 128 262 Z" 
          fill="#FFFFFF"/>

    <!-- Right High-Intensity LED Headlamp -->
    <path d="M384 262 L332 262 C324 262 318 270 322 278 L334 296 C338 302 346 306 354 306 L388 306 C398 306 404 296 400 286 L392 268 C390 264 387 262 384 262 Z" 
          fill="#FFFFFF"/>

    <!-- Center Lower Grille: Styled 'M' Shape in Dark Ink -->
    <path d="M208 322 L228 368 C232 376 242 382 251 382 C253 382 254 382 256 382 C258 382 259 382 261 382 C270 382 280 376 284 368 L304 322 C308 314 302 306 294 306 L218 306 C210 306 204 314 208 322 Z" 
          fill="#0c161c"/>
    <!-- Yellow 'M' Accent Bar inside Lower Grille -->
    <path d="M228 322 L256 362 L284 322" fill="none" stroke="url(#hivisGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wheels / Underbody Tires -->
    <rect x="94" y="322" width="40" height="74" rx="14" fill="#0c161c" stroke="url(#hivisGrad)" stroke-width="8"/>
    <rect x="378" y="322" width="40" height="74" rx="14" fill="#0c161c" stroke="url(#hivisGrad)" stroke-width="8"/>
  </g>

  <!-- Wordmark 'MC' in Lower Corner or Accent Tag -->
  <g transform="translate(160, 412)">
    <rect x="0" y="0" width="192" height="42" rx="10" fill="url(#hivisGrad)"/>
    <text x="96" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0c161c" text-anchor="middle" letter-spacing="4">MULTI CARS</text>
  </g>
</svg>
